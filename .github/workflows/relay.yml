name: Exchange Ticker Relay

on:
  # 定时调度已停用：GitHub Actions 美国 IP 被 Binance 永久封锁（HTTP 451，2026-08-11 确认连续 50 次失败）
  # 数据抓取现由日本 VPS (Evoxt 东京) cron 承担，本 workflow 仅保留手动触发用于应急
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run relay (tickers + demon + coinfilter + forward)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          RELAY_AUTH_KEY: ${{ secrets.RELAY_AUTH_KEY }}
          DEMON_URL: ${{ secrets.DEMON_URL }}
          DEMON_RELAY_KEY: ${{ secrets.DEMON_RELAY_KEY }}
          COINFILTER_URL: ${{ secrets.COINFILTER_URL }}
          COINFILTER_RELAY_KEY: ${{ secrets.COINFILTER_RELAY_KEY }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: node relay.mjs
